<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RAG Assistant</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <!-- Marked.js -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- MathJax -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['\\(', '\\)'], ['$', '$']],
        displayMath: [['\\[', '\\]'], ['$$', '$$']],
        processEscapes: true
      },
      options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>

<body>
  <div class="wrap">
    <!-- Left sidebar: conversations -->
    <div class="sidebar" id="sidebar">
      <h1 class="sidebar-title">IMF GPT</h1>
      <div class="sidebar-header">
        <h2>Chats</h2>
        <div class="sidebar-header-actions">
          <button class="import-btn" id="importBtn" type="button" title="Import conversation">Import</button>
          <input type="file" id="importFileInput" accept=".json" style="display:none;">
          <button class="new-conv-btn" id="newConvBtn" type="button">New</button>
        </div>
      </div>
      <ul class="conversations-list" id="conversationsList"></ul>
    </div>
    <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="Toggle sidebar">◀</button>

    <div class="card">
      <div class="topbar">
        <span id="status" class="muted"></span>
      </div>

      <div class="chat-main">
        <div class="messages-area" id="messagesArea">
          <div id="welcome" style="display:flex; align-items:center; justify-content:center; flex:1; height:100%;">
            <div style="text-align:center; color:#999;">
              <div style="font-size:38px; margin-bottom:12px;">📏</div>
              <div style="font-size:18px; font-weight:500;">Let's math!</div>
            </div>
          </div>
          <div id="singleView" class="section">
            <div id="singlePromptBubble" class="chat-bubble user single-question-bubble" style="display:none;">
              <div class="chat-bubble-label">You</div>
              <div id="singlePromptContent" class="chat-bubble-content"></div>
            </div>

            <h2 class="box-title">From the notes <span id="cov" class="pill" style="display:none;"></span></h2>
            <div id="notes" class="answer"></div>

            <div id="sources" class="sources"></div>

            <details id="extraBox" style="display:none;">
              <summary class="box-title">Extra context (not from notes)</summary>
              <div id="extra" class="answer" style="margin-top:10px;"></div>
            </details>

            <!-- Problem section (single-mode, appears after answer) -->
            <div id="problemSection" class="problem-section" style="display:none;">
              <h2 class="box-title">Practice Problem</h2>
              <div id="problemContent" class="problem-box"></div>

              <div id="answerInputArea" class="answer-input-area">
                <label for="studentAnswer">Your answer:</label>
                <textarea id="studentAnswer" class="answer-input"
                  placeholder="Enter your answer here… (LaTeX is OK, e.g. $\frac{1}{2}$)"></textarea>
                <div class="row">
                  <button id="hintBtn" class="hint-btn" type="button">💡</button>
                  <button id="submitAnswerBtn" class="submit-answer-btn" type="button">Check my answer</button>
                  <button id="showAnswerBtn" class="show-answer-btn" type="button" disabled>Show answer</button>
                  <button id="newProblemBtn" class="new-problem-btn" type="button">New problem</button>
                </div>
              </div>

              <h3 id="generatedAnswerTitle" class="box-title" style="display:none;">Answer</h3>
              <div id="generatedAnswerBox" class="generated-answer-box answer"></div>
              <h3 id="hintTitle" class="box-title" style="display:none;">Hint</h3>
              <div id="hintBox" class="hint-box" style="display:none;"></div>
              <h3 id="assessmentTitle" class="box-title" style="display:none;">Assessment</h3>
              <div id="assessmentBox" class="assessment-box"></div>
            </div>
          </div>

          <!-- Chat conversation view -->
          <div id="chatView" class="chat-container">
            <div class="chat-scroll" id="chatScroll"></div>
          </div>

          <div class="problem-actions" id="problemActions" style="display:none;">
            <button id="problemBtn" class="problem-action-btn" type="button">+ Generate Problem</button>
            <select id="problemDifficulty">
              <option value="easy">Easy</option>
              <option value="medium" selected>Medium</option>
              <option value="hard">Hard</option>
            </select>
          </div>
        </div>

        <!-- Sticky input bar at bottom -->
        <div class="input-bar">
          <div class="input-row">
            <div class="composer">
              <textarea id="q" placeholder="Ask something… (math is OK)" rows="1"></textarea>
              <button id="askBtn" type="button" aria-label="Ask" title="Ask (Ctrl+Enter)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="12" y1="19" x2="12" y2="5"></line>
                  <polyline points="5 12 12 5 19 12"></polyline>
                </svg>
              </button>
            </div>
          </div>

          <div class="controls-row">
            <label id="extraModeLabel">
              Extra:
              <select id="extraMode">
                <option value="auto" selected>auto</option>
                <option value="always">always</option>
                <option value="never">never</option>
              </select>
            </label>

            <label id="chatModelLabel">
              Model:
              <select id="chatModel" disabled>
                <option value="">Loading...</option>
              </select>
            </label>

            <label id="courseLabel">
              Course:
              <select id="courseSelect">
                <option value="">All courses</option>
              </select>
            </label>

          </div>
        </div>
      </div>

      <div id="err" class="err"></div>
    </div>

    <!-- Right sidebar: practice problem (chat mode) -->
    <div class="right-sidebar collapsed" id="rightSidebar">
      <div class="resize-grip" id="rightSidebarGrip"></div>
      <div class="right-sidebar-header">
        <h2 class="right-sidebar-title" id="rightSidebarTitle">Practice Problems</h2>
      </div>
      <!-- Scrollable content -->
      <div class="right-sidebar-content" id="rightSidebarContent">
        <div class="right-sidebar-welcome" id="rightSidebarWelcome">
          Click "Problem" to generate a practice problem from this conversation.
        </div>
        <div id="rightProblemArea" style="display:none;">
          <div id="rightProblemContent" class="problem-box"></div>

          <div id="rightAnswerInputArea" class="answer-input-area visible">
            <label for="rightStudentAnswer">Your answer:</label>
            <textarea id="rightStudentAnswer" class="answer-input"
              placeholder="Enter your answer here… (LaTeX is OK, e.g. $\frac{1}{2}$)"></textarea>
            <div class="row">
              <button id="rightHintBtn" class="hint-btn" type="button">💡</button>
              <button id="rightSubmitAnswerBtn" class="submit-answer-btn" type="button">Check my answer</button>
              <button id="rightShowAnswerBtn" class="show-answer-btn" type="button" disabled>Show answer</button>
            </div>
          </div>

          <h3 id="rightGeneratedAnswerTitle" class="box-title" style="display:none;">Answer</h3>
          <div id="rightGeneratedAnswerBox" class="generated-answer-box answer" style="display:none;"></div>
          <h3 id="rightHintTitle" class="box-title" style="display:none;">Hint</h3>
          <div id="rightHintBox" class="hint-box" style="display:none;"></div>
          <h3 id="rightAssessmentTitle" class="box-title" style="display:none;">Assessment</h3>
          <div id="rightAssessmentBox" class="assessment-box" style="display:none;"></div>
        </div>
      </div>
    </div>
    <button class="right-sidebar-toggle" id="rightSidebarToggle" type="button">◀</button>
  </div>

  <script>
    function $(id) { return document.getElementById(id); }
    function setStatus(msg) { $("status").textContent = msg || ""; }
    function setError(msg) {
      $("err").textContent = msg || "";
      if (msg) logDebug("UI error", { message: String(msg) });
    }

    function debugStamp() {
      return new Date().toISOString();
    }

    function logDebug(message, data) {
      var line = "[" + debugStamp() + "] " + message;
      if (typeof data !== "undefined") {
        try {
          line += " " + JSON.stringify(data);
        } catch (e) {
          line += " " + String(data);
        }
      }

      var logEl = $("debugLog");
      if (logEl) {
        logEl.textContent += line + "\n";
        var lines = logEl.textContent.split("\n");
        if (lines.length > 300) {
          logEl.textContent = lines.slice(lines.length - 300).join("\n");
        }
        logEl.scrollTop = logEl.scrollHeight;
      }

      console.log("[rag2]", message, data || "");
    }

    function responseDebugInfo(response) {
      return {
        status: response.status,
        ok: response.ok,
        contentType: response.headers.get("content-type"),
        requestId: response.headers.get("x-request-id")
      };
    }

    function parseSSEBlock(block) {
      var eventName = "message";
      var dataLines = [];
      var lines = block.split("\n");

      for (var i = 0; i < lines.length; i++) {
        var line = lines[i].replace(/\r$/, "");
        if (!line || line.startsWith(":")) continue;
        if (line.startsWith("event:")) {
          eventName = line.slice(6).trim();
        } else if (line.startsWith("data:")) {
          dataLines.push(line.slice(5).trimStart());
        }
      }

      if (!dataLines.length) return null;

      try {
        return { event: eventName, data: JSON.parse(dataLines.join("\n")) };
      } catch (e) {
        logDebug("Failed to parse SSE data", { event: eventName, raw: dataLines.join("\n").slice(0, 300) });
        return null;
      }
    }

    function drainSSEBuffer(buffer, onEvent) {
      buffer = buffer.replace(/\r\n/g, "\n");
      var boundary = buffer.indexOf("\n\n");

      while (boundary !== -1) {
        var block = buffer.slice(0, boundary);
        buffer = buffer.slice(boundary + 2);

        if (block.trim()) {
          var parsed = parseSSEBlock(block);
          if (parsed) {
            console.log("[PARSED SSE]", parsed.event, parsed.data);
            onEvent(parsed.event, parsed.data);
          }
        }

        boundary = buffer.indexOf("\n\n");
      }

      return buffer;
    }

    async function readEventStream(response, onEvent) {
      var reader = response.body.getReader();
      var decoder = new TextDecoder();
      var buffer = "";

      while (true) {
        var result = await reader.read();
        if (result.done) break;
        var chunk = decoder.decode(result.value, { stream: true });
        console.log("[RAW SSE CHUNK]", chunk);
        buffer += chunk;
        buffer = drainSSEBuffer(buffer, onEvent);
      }

      buffer += decoder.decode();
      buffer = drainSSEBuffer(buffer, onEvent);

      if (buffer.trim()) {
        logDebug("SSE stream ended with leftover buffer", { tail: buffer.slice(-300) });
      }
    }

    function escapeHtml(str) {
      return String(str || "").replace(/[&<>"']/g, function (c) {
        return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
      });
    }

    /**
     * Render markdown to HTML safely.
     * Protects LaTeX delimiters from being mangled by the markdown parser.
     */
    function renderMarkdown(text) {
      if (!text) return "";

      // 1. Protect LaTeX blocks by replacing them with placeholders
      var placeholders = [];
      var i = 0;

      // Protect display math ($$...$$) first
      text = text.replace(/\$\$[\s\S]*?\$\$/g, function (match) {
        var id = "%%MATHBLOCK" + (i++) + "%%";
        placeholders.push({ id: id, content: match });
        return id;
      });

      // Protect inline math ($...$)
      text = text.replace(/\$[^$\n]+?\$/g, function (match) {
        var id = "%%MATHBLOCK" + (i++) + "%%";
        placeholders.push({ id: id, content: match });
        return id;
      });

      // Protect \[...\] display math
      text = text.replace(/\\\[[\s\S]*?\\\]/g, function (match) {
        var id = "%%MATHBLOCK" + (i++) + "%%";
        placeholders.push({ id: id, content: match });
        return id;
      });

      // Protect \(...\) inline math
      text = text.replace(/\\\([\s\S]*?\\\)/g, function (match) {
        var id = "%%MATHBLOCK" + (i++) + "%%";
        placeholders.push({ id: id, content: match });
        return id;
      });

      // 2. Parse markdown to HTML
      var html = marked.parse(text, { breaks: true });

      // 3. Restore LaTeX placeholders
      placeholders.forEach(function (p) {
        html = html.replace(p.id, p.content);
      });

      return html;
    }

    function showThinking(targetId) {
      $(targetId).innerHTML =
        '<div class="thinking">' +
        '<div class="thinking-dots"><span></span><span></span><span></span></div>' +
        ' Thinking…' +
        '</div>';
    }

    function renderSources(list) {
      if (!list || !list.length) {
        $("sources").innerHTML = "<div class=\"muted\">No sources retrieved.</div>";
        return;
      }
      var items = list.map(function (s) {
        var heading = s.heading ? (" — " + escapeHtml(s.heading)) : "";
        return "<li><strong>" + escapeHtml(s.tag || "") + "</strong> " +
          escapeHtml(s.source || "") + heading +
          " (chunk " + escapeHtml(String(s.chunk_id)) + ")</li>";
      }).join("");
      $("sources").innerHTML = "<div><strong>Sources</strong></div><ul>" + items + "</ul>";
    }

    async function typesetMath() {
      if (window.MathJax && MathJax.typesetPromise) {
        try {
          MathJax.startup.document.clear();
          MathJax.startup.document.updateDocument();
          await MathJax.typesetPromise();
        } catch (e) { }
      }
    }

    // Streaming state
    var isChatMode = true;
    var chatHistory = []; // [{question, answer}]
    var rawNotes = "";
    var rawExtra = "";
    var mathRenderTimer = null;
    var lastSingleQuestion = ""; // last single-mode question shown above the answer
    var lastNotesAnswer = "";    // last notes answer (for problem context)
    var currentProblemRaw = "";  // raw problem text from LLM (active problem)
    var currentGeneratedAnswerRaw = ""; // hidden answer key for assessment (active problem)

    // Problems array for chat mode: [{problem, generated_answer, student_answer, assessment}, ...]
    var problems = [];
    var activeProblemIndex = -1;

    var MAX_TURNS = 20;

    // --- User preferences (localStorage) ---
    var USER_PREFS_KEY = "rag_user_prefs";

    function getUserPrefs() {
      try {
        return JSON.parse(localStorage.getItem(USER_PREFS_KEY) || "{}");
      } catch (e) { return {}; }
    }

    function setUserPref(key, value) {
      try {
        var prefs = getUserPrefs();
        prefs[key] = value;
        localStorage.setItem(USER_PREFS_KEY, JSON.stringify(prefs));
      } catch (e) { }
    }

    // --- Conversation persistence (localStorage) ---
    var CONV_STORAGE_KEY = "rag_conversations";
    var currentConvId = null; // null = unsaved / new

    function _convKey(id) { return CONV_STORAGE_KEY + ":" + id; }
    function _convMetaKey() { return CONV_STORAGE_KEY + "_meta"; }

    function listConversationIds() {
      try {
        var meta = JSON.parse(localStorage.getItem(_convMetaKey()) || "[]");
        return Array.isArray(meta) ? meta : [];
      } catch (e) { return []; }
    }

    function saveConversation(id, title, history, _problems) {
      try {
        var entry = { id: id, title: title, updated: Date.now(), history: history, problems: _problems || [] };
        localStorage.setItem(_convKey(id), JSON.stringify(entry));
        var ids = listConversationIds();
        if (ids.indexOf(id) === -1) {
          ids.unshift(id);
          localStorage.setItem(_convMetaKey(), JSON.stringify(ids));
        }
      } catch (e) {
        logDebug("Failed to save conversation", { error: String(e) });
      }
    }

    function loadConversation(id) {
      try {
        var raw = localStorage.getItem(_convKey(id));
        if (!raw) return null;
        return JSON.parse(raw);
      } catch (e) { return null; }
    }

    function deleteConversation(id) {
      try {
        localStorage.removeItem(_convKey(id));
        var ids = listConversationIds();
        var idx = ids.indexOf(id);
        if (idx !== -1) {
          ids.splice(idx, 1);
          localStorage.setItem(_convMetaKey(), JSON.stringify(ids));
        }
      } catch (e) { }
    }

    function conversationTitleFromHistory(history) {
      if (!history || !history.length) return "New conversation";
      var q = history[0].question || "";
      q = q.replace(/\s+/g, " ").trim();
      if (!q) return "New conversation";
      return q.length > 40 ? q.slice(0, 37) + "…" : q;
    }

    function setActiveConversationId(id) {
      currentConvId = id;
      renderSidebar();
    }

    function renderSidebar() {
      var listEl = $("conversationsList");
      var ids = listConversationIds();
      listEl.innerHTML = "";
      if (!ids.length) {
        var empty = document.createElement("div");
        empty.className = "sidebar-empty";
        empty.textContent = "No conversations yet";
        listEl.appendChild(empty);
        return;
      }
      for (var i = 0; i < ids.length; i++) {
        var id = ids[i];
        var conv = loadConversation(id);
        var title = conv && conv.title ? conv.title : "Conversation";
        var li = document.createElement("li");
        if (id === currentConvId) li.classList.add("active");
        li.onclick = (function (cid) {
          return function () {
            switchToConversation(cid);
          };
        })(id);

        var span = document.createElement("span");
        span.className = "conv-title";
        span.textContent = title;

        var menuBtn = document.createElement("button");
        menuBtn.className = "conv-menu-btn";
        menuBtn.textContent = "…";
        menuBtn.title = "More";
        menuBtn.onclick = (function (cid, btn) {
          return function (e) {
            e.stopPropagation();
            toggleConvMenu(cid, e, btn);
          };
        })(id, menuBtn);

        li.appendChild(span);
        li.appendChild(menuBtn);
        listEl.appendChild(li);
      }
    }

    /**
     * Close any open conversation dropdown menus.
     */
    function closeAllConvMenus() {
      var menus = document.querySelectorAll(".conv-menu-dropdown");
      for (var i = 0; i < menus.length; i++) {
        menus[i].remove();
      }
    }

    /**
     * Show the overflow menu (download / rename / delete) for a conversation.
     */
    function toggleConvMenu(cid, clickEvent, anchorBtn) {
      var existing = document.getElementById("conv-menu-" + cid);
      if (existing) {
        existing.remove();
        return;
      }
      closeAllConvMenus();

      var dd = document.createElement("div");
      dd.id = "conv-menu-" + cid;
      dd.className = "conv-menu-dropdown";

      var items = [
        { label: "Download", action: function () { downloadConversation(cid); closeAllConvMenus(); } },
        { label: "Rename", action: function () { renameConversation(cid); closeAllConvMenus(); } },
        { label: "Delete", action: function () {
          if (confirm("Delete this conversation?")) {
            deleteConversation(cid);
            if (currentConvId === cid) startNewConversation();
            else renderSidebar();
          }
          closeAllConvMenus();
        } }
      ];

      for (var i = 0; i < items.length; i++) {
        (function (item) {
          var btn = document.createElement("button");
          btn.type = "button";
          btn.textContent = item.label;
          btn.onclick = function (e) {
            e.stopPropagation();
            item.action();
          };
          dd.appendChild(btn);
        })(items[i]);
      }

      document.body.appendChild(dd);

      var btnRect = anchorBtn.getBoundingClientRect();
      dd.style.position = 'fixed';
      dd.style.top = (btnRect.bottom + 4) + 'px';
      dd.style.right = (window.innerWidth - btnRect.right) + 'px';
      dd.style.left = 'auto';
    }

    function renameConversation(id) {
      var conv = loadConversation(id);
      if (!conv) return;
      var newTitle = prompt("Rename conversation:", conv.title || "");
      if (newTitle === null) return; // cancelled
      newTitle = newTitle.trim();
      if (!newTitle) newTitle = "Conversation";
      conv.title = newTitle;
      conv.updated = Date.now();
      try {
        localStorage.setItem(_convKey(id), JSON.stringify(conv));
      } catch (e) {
        logDebug("Failed to rename conversation", { error: String(e) });
      }
      if (currentConvId === id) renderChatConversation();
      renderSidebar();
    }

    function downloadConversation(id) {
      var conv = loadConversation(id);
      if (!conv) return;
      var blob = new Blob([JSON.stringify(conv, null, 2)], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      var safeTitle = (conv.title || "conversation").replace(/[^a-z0-9\-_\s]/gi, "").trim().replace(/\s+/g, "_") || "conversation";
      a.download = safeTitle + "_" + id + ".json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function importConversation(file) {
      var reader = new FileReader();
      reader.onload = function (e) {
        var text = e.target.result;
        var data;
        try {
          data = JSON.parse(text);
        } catch (err) {
          setError("Invalid JSON file.");
          return;
        }
        if (!data || typeof data !== "object") {
          setError("Invalid conversation file.");
          return;
        }
        if (!Array.isArray(data.history)) {
          setError("Invalid conversation file: missing history.");
          return;
        }
        var newId = "conv_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7);
        var entry = {
          id: newId,
          title: (data.title || "Imported conversation"),
          updated: Date.now(),
          history: data.history,
          problems: Array.isArray(data.problems) ? data.problems : []
        };
        try {
          localStorage.setItem(_convKey(newId), JSON.stringify(entry));
          var ids = listConversationIds();
          ids.unshift(newId);
          localStorage.setItem(_convMetaKey(), JSON.stringify(ids));
          renderSidebar();
          switchToConversation(newId);
          setStatus("Conversation imported.");
        } catch (err) {
          logDebug("Failed to import conversation", { error: String(err) });
          setError("Failed to import conversation.");
        }
      };
      reader.readAsText(file);
    }

    function startNewConversation() {
      chatHistory = [];
      rawNotes = "";
      rawExtra = "";
      currentProblemRaw = "";
      currentGeneratedAnswerRaw = "";
      problems = [];
      activeProblemIndex = -1;
      currentConvId = null;
      renderChatConversation();
      renderSidebar();
      resetRightSidebarProblemUI();
      resetRightSidebarAssessmentUI();
      $("rightSidebarWelcome").style.display = "flex";
      $("rightProblemArea").style.display = "none";
      $("rightSidebarTitle").textContent = "Practice Problems";
      $("rightStudentAnswer").value = "";
      $("welcome").style.display = "flex";
      $("problemActions").style.display = "none";
    }

    function switchToConversation(id) {
      var conv = loadConversation(id);
      if (!conv || !conv.history) return;
      chatHistory = conv.history;
      rawNotes = "";
      rawExtra = "";
      problems = Array.isArray(conv.problems) ? conv.problems : [];
      activeProblemIndex = -1;
      currentProblemRaw = "";
      currentGeneratedAnswerRaw = "";
      currentConvId = id;
      $("welcome").style.display = "none";
      resetRightSidebarAssessmentUI();
      if (problems.length > 0) {
        activeProblemIndex = problems.length - 1;
        renderActiveProblem();
      } else {
        $("rightSidebarWelcome").style.display = "flex";
        $("rightProblemArea").style.display = "none";
      }
      renderChatConversation();
      $("problemActions").style.display = chatHistory.length > 0 ? "flex" : "none";
      renderSidebar();
    }

    function autoSaveCurrentConversation() {
      if (!chatHistory.length) return;
      if (!currentConvId) {

    function animateSync(fn, duration) {
      var start = performance.now();
      function tick() {
        fn();
        if (performance.now() - start < (duration || 220)) {
          requestAnimationFrame(tick);
        } else {
          fn();
        }
      }
      tick();
    }

    // --- Hint ---
    async function requestHint(isRight) {
      var problemText = currentProblemRaw || "";
      if (!problemText) return;
      var payload = applySelectedChatModel({ problem: problemText });
      var btnId = isRight ? "rightHintBtn" : "hintBtn";
      var boxId = isRight ? "rightHintBox" : "hintBox";
      var titleId = isRight ? "rightHintTitle" : "hintTitle";

      // Hide other output boxes
      if (isRight) {
        $("rightGeneratedAnswerTitle").style.display = "none";
        $("rightGeneratedAnswerBox").classList.remove("visible");
        $("rightGeneratedAnswerBox").style.display = "none";
        $("rightAssessmentTitle").style.display = "none";
        $("rightAssessmentBox").classList.remove("visible");
        $("rightAssessmentBox").style.display = "none";
      } else {
        $("generatedAnswerTitle").style.display = "none";
        $("generatedAnswerBox").classList.remove("visible");
        $("generatedAnswerBox").style.display = "none";
        $("assessmentTitle").style.display = "none";
        $("assessmentBox").classList.remove("visible");
        $("assessmentBox").style.display = "none";
      }

      $(btnId).disabled = true;
      $(titleId).style.display = "block";
      $(boxId).style.display = "block";
      $(boxId).innerHTML = '<div class="thinking"></div>';
      var hintRaw = "";
      try {
        var response = await fetch("/rag2/hint", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
        if (!response.ok) throw new Error("HTTP " + response.status);
        logDebug("Hint response", responseDebugInfo(response));
        await readEventStream(response, function (event, data) {
          if (event === "token") {
            hintRaw += data.content || "";
            $(boxId).innerHTML = renderMarkdown(hintRaw);
            $(boxId).classList.add("streaming-cursor");
            clearTimeout(mathRenderTimer);
            mathRenderTimer = setTimeout(function () { typesetMath(); }, 400);
            return;
          }
          if (event === "done") {
            $(boxId).classList.remove("streaming-cursor");
            $(boxId).innerHTML = renderMarkdown(hintRaw);
            typesetMath();
          }
        });
      } catch (err) {
        $(boxId).innerText = "Hint failed: " + err.message;
      } finally {
        $(btnId).disabled = false;
      }
    }

    // --- Shared problem / answer / assessment cores ---

    async function _calculateAnswerCore(payload, submitBtnId, showBtnId, label) {
      currentGeneratedAnswerRaw = "";
      try {
        logDebug("Calculate answer request start" + (label ? " (" + label + ")" : ""), {
          problemLen: (currentProblemRaw || "").length,
          chatModel: getSelectedChatModel() || "(default)"
        });
        var response = await fetch("/rag2/calculate-answer", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(applySelectedCourse(applySelectedChatModel(payload)))
        });

        if (!response.ok) {
          var errText = await response.text();
          throw new Error("HTTP " + response.status + "\n" + errText);
        }
        logDebug("Calculate answer response", responseDebugInfo(response));

        await readEventStream(response, function (event, data) {
          if (event === "meta") { logDebug("Calculate answer stream meta", data); return; }
          if (event === "status") {
            if (data.phase === "thinking" || data.phase === "solving") setStatus("Preparing answer key...");
            return;
          }
          if (event === "token") { currentGeneratedAnswerRaw += data.content || ""; return; }
          if (event === "solution_done") { if (data.answer) currentGeneratedAnswerRaw = data.answer; return; }
          if (event === "error") {
            throw new Error((data && data.message ? data.message : "Answer stream error") + (data && data.request_id ? " [request_id=" + data.request_id + "]" : ""));
          }
          if (event === "done") { logDebug("Calculate answer stream done", data); }
        });

        if (!currentGeneratedAnswerRaw.trim()) throw new Error("Generated answer was empty.");

        $(submitBtnId).disabled = false;
        $(showBtnId).disabled = false;
        setStatus("Problem ready - try solving it!");
      } catch (e) {
        logDebug("Calculate answer request failed", { label: label, error: String(e) });
        throw e;
      }
    }

    async function _submitAssessCore(studentAnswer, targetTitleId, targetBoxId, targetSubmitId, label) {
      // Hide hint and answer boxes when showing assessment
      var isRight = targetBoxId.startsWith("right");
      var hintTitleId = isRight ? "rightHintTitle" : "hintTitle";
      var hintBoxId   = isRight ? "rightHintBox"   : "hintBox";
      var ansTitleId  = isRight ? "rightGeneratedAnswerTitle" : "generatedAnswerTitle";
      var ansBoxId    = isRight ? "rightGeneratedAnswerBox"   : "generatedAnswerBox";
      $(hintTitleId).style.display = "none";
      $(hintBoxId).style.display = "none";
      $(hintBoxId).innerHTML = "";
      $(ansTitleId).style.display = "none";
      $(ansBoxId).classList.remove("visible");
      $(ansBoxId).style.display = "none";
      $(ansBoxId).innerHTML = "";
      var ansBtnId = isRight ? "rightShowAnswerBtn" : "showAnswerBtn";
      $(ansBtnId).textContent = "Show answer";

      $(targetTitleId).style.display = "block";
      $(targetBoxId).classList.add("visible");
      $(targetBoxId).style.display = "block";
      showThinking(targetBoxId);
      $(targetSubmitId).disabled = true;
      setStatus("Checking your answer...");

      var assessRaw = "";
      try {
        logDebug("Assess request start" + (label ? " (" + label + ")" : ""), {
          problemLen: (currentProblemRaw || "").length,
          generatedLen: (currentGeneratedAnswerRaw || "").length,
          answerLen: studentAnswer.length,
          chatModel: getSelectedChatModel() || "(default)"
        });
        var response = await fetch("/rag2/assess", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(applySelectedCourse(applySelectedChatModel({
            problem: currentProblemRaw,
            generated_answer: currentGeneratedAnswerRaw,
            student_answer: studentAnswer
          })))
        });

        if (!response.ok) {
          var errText = await response.text();
          throw new Error("HTTP " + response.status + "\n" + errText);
        }
        await readEventStream(response, function (event, data) {
          if (event === "meta" || event === "status") return;
          if (event === "token") {
            assessRaw += data.content || "";
            $(targetBoxId).innerHTML = renderMarkdown(assessRaw);
            $(targetBoxId).classList.add("streaming-cursor");
            clearTimeout(mathRenderTimer);
            mathRenderTimer = setTimeout(function () { typesetMath(); }, 400);
            return;
          }
          if (event === "error") {
            throw new Error((data && data.message ? data.message : "Assessment stream error") + (data && data.request_id ? " [request_id=" + data.request_id + "]" : ""));
          }
          if (event === "done") { logDebug("Assess stream done", data); }
        });

        $(targetBoxId).classList.remove("streaming-cursor");
        $(targetBoxId).innerHTML = renderMarkdown(assessRaw);
        await typesetMath();
        setStatus("Done.");
        return assessRaw;
      } catch (e) {
        logDebug("Assess request failed", { label: label, error: String(e) });
        setError(String(e));
        setStatus("Error");
      } finally {
        $(targetSubmitId).disabled = false;
      }
    }

    // Chat rendering
    function _problemPreviewText(problemRaw) {
      if (!problemRaw) return "";
      var text = problemRaw.replace(/^\s*\*\*Problem:?\*\*\s*/i, "").trim();
      text = text.replace(/\n/g, " ");
      return text.length > 80 ? text.slice(0, 77) + "…" : text;
    }

    function renderChatConversation() {
      var scroll = $("chatScroll");
      if (chatHistory.length === 0 && problems.length === 0) {
        scroll.innerHTML = '<div style="padding:30px;text-align:center;color:#aaa;">Start a conversation by asking a question.</div>';
        return;
      }

      // Build a unified timeline of all items
      var timeline = [];
      for (var i = 0; i < chatHistory.length; i++) {
        var turn = chatHistory[i];
        var ts = turn.createdAt || (i * 10);
        timeline.push({ type: 'user',   data: turn.question, createdAt: ts, sortOrder: 0, index: i });
        timeline.push({ type: 'assistant', data: turn, createdAt: ts, sortOrder: 1, index: i });
      }
      for (var p = 0; p < problems.length; p++) {
        var prob = problems[p];
        var pts = prob.createdAt || (1000000 + p * 10);
        timeline.push({ type: 'problem', data: prob, createdAt: pts, sortOrder: 2, index: p });
      }
      timeline.sort(function(a, b) {
        if (a.createdAt !== b.createdAt) return a.createdAt - b.createdAt;
        return a.sortOrder - b.sortOrder;
      });

      var html = "";
      for (var j = 0; j < timeline.length; j++) {
        var item = timeline[j];
        if (item.type === 'user') {
          html += '<div class="chat-bubble user">';
          html += '<div class="chat-bubble-content">' + escapeHtml(item.data) + '</div>';
          html += '<div class="message-meta">You</div>';
          html += '</div>';
        } else if (item.type === 'assistant') {
          var turn = item.data;
          html += '<div class="chat-bubble assistant">';
          html += '<div class="assistant-row">';
          html += '<div class="assistant-avatar" aria-hidden="true">RAG</div>';
          html += '<div class="assistant-body">';
          html += '<div class="assistant-label">Assistant <span>&middot;</span> <small>based on your materials</small></div>';
          html += '<div class="chat-bubble-content">' + renderMarkdown(turn.answer) + '</div>';
          if (turn.coverage) {
            html += '<div class="chat-bubble-meta"><span class="pill"><span></span> coverage: ' + escapeHtml(turn.coverage) + '</span></div>';
          }
          html += '</div>';
          html += '</div>';
          html += '</div>';
        } else if (item.type === 'problem') {
          var prob = item.data;
          var preview = _problemPreviewText(prob.problem);
          var isActive = item.index === activeProblemIndex;
          html += '<div class="chat-bubble assistant problem-bubble' + (isActive ? ' active' : '') + '" data-problem-index="' + item.index + '">';
          html += '<div class="assistant-row">';
          html += '<div class="assistant-avatar" aria-hidden="true">RAG</div>';
          html += '<div class="assistant-body">';
          html += '<div class="assistant-label">Assistant <span>&middot;</span> <small>generated problem</small></div>';
          html += '<div class="chat-bubble-content">';
          if (preview) {
            html += '<div class="problem-card-preview">' + escapeHtml(preview) + '</div>';
          }
          html += '<div class="problem-card-actions">';
          html += '<button class="problem-card-btn" data-problem-index="' + item.index + '">Open Problem</button>';
          html += '<button class="problem-adjust-btn" data-adjust="easier" data-problem-index="' + item.index + '">Easier</button>';
          html += '<button class="problem-adjust-btn" data-adjust="harder" data-problem-index="' + item.index + '">Harder</button>';
          html += '</div>';
          html += '</div>';
          html += '</div>';
          html += '</div>';
          html += '</div>';
        }
      }

      scroll.innerHTML = html;
      scroll.scrollTop = scroll.scrollHeight;
      typesetMath();
    }

    function setChatModelUnavailable(message) {
      var select = $("chatModel");
      var option = document.createElement("option");
      option.value = "";
      option.textContent = message || "Default";
      select.innerHTML = "";
      select.appendChild(option);
      select.disabled = true;
      select.title = message || "";
    }

    function chatModelSelectHasValue(select, value) {
      if (!select || !value) return false;
      for (var i = 0; i < select.options.length; i++) {
        if (select.options[i].value === value) {
          return true;
        }
      }
      return false;
    }

    function syncChatModelTitle() {
      var select = $("chatModel");
      if (!select) return;
      var option = select.options[select.selectedIndex];
      select.title = option ? option.textContent : "";
    }

    function populateChatModels(models, defaultModel) {
      var select = $("chatModel");
      var previousValue = (select.value || "").trim();
      var list = Array.isArray(models) ? models : [];

      select.innerHTML = "";

      for (var i = 0; i < list.length; i++) {
        var model = list[i] || {};
        var modelId = String(model.id || "").trim();
        if (!modelId) continue;

        var label = String(model.label || modelId);
        if (model.default || modelId === defaultModel) {
          label += " (default)";
        }

        var option = document.createElement("option");
        option.value = modelId;
        option.textContent = label;
        if (model.description) {
          option.title = String(model.description);
        }
        select.appendChild(option);
      }

      if (!select.options.length) {
        setChatModelUnavailable("No models available");
        return;
      }

      var prefs = getUserPrefs();
      var savedModel = String(prefs.chat_model || "").trim();

      var targetValue = previousValue;
      if (savedModel && chatModelSelectHasValue(select, savedModel)) {
        targetValue = savedModel;
      }
      if (!targetValue || !chatModelSelectHasValue(select, targetValue)) {
        targetValue = String(defaultModel || "");
      }
      if (!targetValue || !chatModelSelectHasValue(select, targetValue)) {
        targetValue = select.options[0].value;
      }

      select.disabled = false;
      select.value = targetValue;
      syncChatModelTitle();
    }

    function getSelectedChatModel() {
      var select = $("chatModel");
      if (!select || select.disabled) return "";
      return String(select.value || "").trim();
    }

    function applySelectedChatModel(payload) {
      var selectedChatModel = getSelectedChatModel();
      if (selectedChatModel) {
        payload.chat_model = selectedChatModel;
      }
      return payload;
    }

        var response = await fetch("/rag2/chat-models");
        if (!response.ok) {
          var errText = await response.text();
          throw new Error("HTTP " + response.status + "\n" + errText);
        }

        logDebug("Chat models response", responseDebugInfo(response));
        var data = await response.json();
        var models = data && Array.isArray(data.models) ? data.models : [];
        var defaultModel = data && typeof data.default_chat_model === "string"
          ? data.default_chat_model
          : "";

        populateChatModels(models, defaultModel);
        logDebug("Chat models loaded", {
          count: models.length,
          defaultModel: defaultModel,
          selectedModel: getSelectedChatModel()
        });
      } catch (e) {
        logDebug("Chat models request failed", { error: String(e) });
        setChatModelUnavailable("Default only");
      }
    }

    function updateStreamingBubble(rawText) {
      var target = document.getElementById("chatStreamTarget");
      if (target) {
        target.innerHTML = renderMarkdown(rawText);
        target.classList.add("streaming-cursor");
        var scroll = $("chatScroll");
        scroll.scrollTop = scroll.scrollHeight;
      }

      clearTimeout(mathRenderTimer);
      mathRenderTimer = setTimeout(function () { typesetMath(); }, 400);
    }

    function finalizeStreamingBubble(coverage) {
      var target = document.getElementById("chatStreamTarget");
      if (target) {
        target.classList.remove("streaming-cursor");
        target.removeAttribute("id");

        if (coverage) {
          var metaDiv = document.createElement("div");
          metaDiv.className = "chat-bubble-meta";
          metaDiv.innerHTML = '<span class="pill"><span></span> coverage: ' + escapeHtml(coverage) + '</span>';
          target.parentElement.appendChild(metaDiv);
        }
      }
    }

    // Mode switching
    function switchMode(toChat) {
      isChatMode = toChat;

      if (toChat) {
        $("singleView").style.display = "none";
        $("chatView").classList.add("visible");
        $("extraModeLabel").style.display = "none";
        $("problemActions").style.display = chatHistory.length > 0 ? "flex" : "none";
        renderChatConversation();
      } else {
        $("singleView").style.display = "block";
        $("chatView").classList.remove("visible");
        $("extraModeLabel").style.display = "flex";
        $("problemActions").style.display = "none";
      }
    }

    // Streaming
    function scheduleRender(targetId, rawText) {
      // Render markdown immediately for text, defer MathJax
      $(targetId).innerHTML = renderMarkdown(rawText);
      $(targetId).classList.add("streaming-cursor");

      // Debounce MathJax (expensive, don't run on every token)
      clearTimeout(mathRenderTimer);
      mathRenderTimer = setTimeout(function () { typesetMath(); }, 400);
    }

    // Problem generation
    // difficultyAdjustment: "", "easier", or "harder"
    async function generateProblem(difficultyAdjustment) {
      setError("");
      currentProblemRaw = "";
      currentGeneratedAnswerRaw = "";

      if (isChatMode) {
        resetRightSidebarAssessmentUI();
        $("rightSidebarWelcome").style.display = "none";
        $("rightProblemArea").style.display = "block";
        $("rightProblemContent").style.display = "block";
        $("rightProblemContent").classList.add("streaming-cursor");
        $("rightAnswerInputArea").classList.remove("visible");
        $("rightStudentAnswer").value = "";
        showThinking("rightProblemContent");
        openRightSidebar();
      } else {
        resetGeneratedAnswerUI();
        $("problemSection").style.display = "block";
        $("problemSection").classList.add("visible");
        $("answerInputArea").classList.remove("visible");
        resetAssessmentUI();
        $("studentAnswer").value = "";
        showThinking("problemContent");
      }

      $("problemBtn").disabled = true;
      $("newProblemBtn").disabled = true;
      $("submitAnswerBtn").disabled = true;
      $("rightSubmitAnswerBtn").disabled = true;
      setStatus("Generating problem…");

      try {
        var payload;
        var chatPayloadBase;
        if (isChatMode) {
          logDebug("Problem request start (chat mode)", {
            turns: chatHistory.length,
            adjustment: difficultyAdjustment || "none",
            chatModel: getSelectedChatModel() || "(default)"
          });
          chatPayloadBase = {
            conversation_context: buildConversationContext(),
            difficulty: $("problemDifficulty").value
          };
        } else {
          logDebug("Problem request start", {
            questionLen: (lastSingleQuestion || "").length,
            notesLen: (lastNotesAnswer || "").length,
            adjustment: difficultyAdjustment || "none",
            chatModel: getSelectedChatModel() || "(default)"
          });
          chatPayloadBase = {
            question: lastSingleQuestion,
            notes_answer: lastNotesAnswer,
            difficulty: $("problemDifficulty").value
          };
        }

        if (difficultyAdjustment) {
          chatPayloadBase.difficulty_adjustment = difficultyAdjustment;
          var prevProb = "";
          if (activeProblemIndex >= 0 && activeProblemIndex < problems.length) {
            prevProb = problems[activeProblemIndex].problem || "";
          }
          if (!prevProb && currentProblemRaw) {
            prevProb = currentProblemRaw;
          }
          if (prevProb) {
            chatPayloadBase.previous_problem = prevProb;
          }
        }

        payload = applySelectedCourse(applySelectedChatModel(chatPayloadBase));

        var response = await fetch("/rag2/problem", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          var errText = await response.text();
          throw new Error("HTTP " + response.status + "\n" + errText);
        }
        logDebug("Problem response", responseDebugInfo(response));

        var targetEl = isChatMode ? "rightProblemContent" : "problemContent";

        await readEventStream(response, function (event, data) {
          if (event === "meta") {
            logDebug("Problem stream meta", data);
            return;
          }
          if (event === "status") {
            logDebug("Problem stream status", data);
            if (data.phase === "generating") {
              $(targetEl).innerHTML = "";
            }
            return;
          }
          if (event === "token") {
            currentProblemRaw += data.content || "";
            $(targetEl).innerHTML = renderMarkdown(currentProblemRaw);
            $(targetEl).classList.add("streaming-cursor");
            clearTimeout(mathRenderTimer);
            mathRenderTimer = setTimeout(function () { typesetMath(); }, 400);
            return;
          }
          if (event === "problem_done") {
            logDebug("Problem stream problem_done", { problemLen: (data.problem || "").length });
            if (data.problem) {
              currentProblemRaw = data.problem;
              $(targetEl).innerHTML = renderMarkdown(currentProblemRaw);
            }
            return;
          }
          if (event === "error") {
            logDebug("Problem stream error", data);
            throw new Error((data && data.message ? data.message : "Problem stream error") + (data && data.request_id ? " [request_id=" + data.request_id + "]" : ""));
          }
          if (event === "done") {
            logDebug("Problem stream done", data);
          }
        });

        // Final render
        $(targetEl).classList.remove("streaming-cursor");
        $(targetEl).innerHTML = renderMarkdown(currentProblemRaw);
        if (!currentProblemRaw.trim()) {
          throw new Error("Problem generation returned empty output.");
        }

        await typesetMath();
        setStatus("Problem ready. Preparing answer key...");

        if (isChatMode) {
          $("rightAnswerInputArea").classList.add("visible");
          addProblem(currentProblemRaw); // saves to problems array + localStorage
          await calculateRightProblemAnswer();
        } else {
          $("answerInputArea").classList.add("visible");
          await calculateProblemAnswer();
        }

      } catch (e) {
        logDebug("Problem request failed", { error: String(e) });
        setError(String(e));
        setStatus("Error");
      } finally {
        $("problemBtn").disabled = false;
        $("newProblemBtn").disabled = false;
      }
    }

    async function calculateProblemAnswer() {
      await _calculateAnswerCore(
        { problem: currentProblemRaw, topic_question: lastSingleQuestion, notes_answer: lastNotesAnswer },
        "submitAnswerBtn", "showAnswerBtn", "single mode"
      );
    }

    // Answer assessment
    async function submitAnswer() {
      setError("");
      var studentAnswer = $("studentAnswer").value.trim();
      if (!studentAnswer) { setError("Please enter your answer."); return; }
      if (!currentGeneratedAnswerRaw.trim()) { setError("The generated answer is not ready yet. Please wait a moment."); return; }
      await _submitAssessCore(studentAnswer, "assessmentTitle", "assessmentBox", "submitAnswerBtn", "single mode");
    }

    // Main ask function
    async function ask() {
      setError("");
      rawNotes = "";
      rawExtra = "";
      currentProblemRaw = "";
      currentGeneratedAnswerRaw = "";
      resetGeneratedAnswerUI();
      resetAssessmentUI();

      var welcome = $("welcome");
      if (welcome) welcome.style.display = "none";

      // Hide problem section when asking new question
      $("problemSection").style.display = "none";
      $("problemSection").classList.remove("visible");
      $("submitAnswerBtn").disabled = false;
      $("newProblemBtn").disabled = false;

      var question = $("q").value.trim();
      var questionTime = Date.now();
      if (!question) {
        setError("Please enter a question.");
        return;
      }

      // Check turn limit in chat mode
      if (isChatMode && chatHistory.length >= MAX_TURNS) {
        setError("Conversation limit reached (" + MAX_TURNS + " turns). Click 'New conversation' to start fresh.");
        return;
      }

      var payload = applySelectedCourse(applySelectedChatModel({
        question: question,
        extra_mode: $("extraMode").value,
        chat_mode: isChatMode,
        history: isChatMode ? chatHistory : []
      }));

      $("askBtn").disabled = true;

      if (!isChatMode) {
        lastSingleQuestion = question;
        renderSinglePrompt(question);
      }

      $("q").value = "";

      if (isChatMode) {
        addStreamingBubbles(question);
        setStatus("Thinking…");
      } else {
        $("notes").innerHTML = "";
        $("extra").innerHTML = "";
        $("extraBox").style.display = "none";
        $("cov").style.display = "none";
        $("sources").innerHTML = "";
        showThinking("notes");
        setStatus("Thinking…");
      }
      try {
        logDebug("Ask request start", {
          questionLen: question.length,
          chatMode: isChatMode,
          historyTurns: payload.history.length,
          extraMode: payload.extra_mode,
          chatModel: payload.chat_model || "(default)"
        });
        var response = await fetch("/rag2/ask-stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          var errText = await response.text();
          throw new Error("HTTP " + response.status + "\n" + errText);
        }
        logDebug("Ask response", responseDebugInfo(response));
        var streamCoverage = "";

        await readEventStream(response, function (event, data) {
          if (event === "notes_done" || event === "done") {
            if (data.coverage) streamCoverage = data.coverage;
          }
          handleSSE(event, data);
        });

        // Final render
        if (isChatMode) {
          chatHistory.push({
            question: question,
            answer: rawNotes,
            coverage: streamCoverage,
            createdAt: questionTime
          });
          finalizeStreamingBubble(streamCoverage);
          autoSaveCurrentConversation();
          // Show Problem actions after first turn
          $("problemActions").style.display = "flex";
        } else {
          $("notes").classList.remove("streaming-cursor");
          $("extra").classList.remove("streaming-cursor");
          $("notes").innerHTML = renderMarkdown(rawNotes);
          if (rawExtra) {
            $("extra").innerHTML = renderMarkdown(rawExtra);
          }

          // Store answer
          lastNotesAnswer = rawNotes;
        }

        await typesetMath();
        setStatus("Done.");

      } catch (e) {
        logDebug("Ask request failed", { error: String(e), chatMode: isChatMode });
        setError(String(e));
        setStatus("Error");
      } finally {
        $("askBtn").disabled = false;
        if (!isChatMode) {
          $("notes").classList.remove("streaming-cursor");
          $("extra").classList.remove("streaming-cursor");
        }
      }
    }

    function handleSSE(event, data) {
      switch (event) {
        case "meta":
          logDebug("Ask stream meta", data);
          break;

        case "status":
          logDebug("Ask stream status", data);
          if (data.phase === "thinking") {
            setStatus("Searching notes…");
            if (!isChatMode) showThinking("notes");
          } else if (data.phase === "notes") {
            setStatus("Writing answer…");
            if (!isChatMode) $("notes").innerHTML = "";
            if (isChatMode) {
              var target = document.getElementById("chatStreamTarget");
              if (target) target.innerHTML = "";
            }
          } else if (data.phase === "extra") {
            setStatus("Adding extra context…");
            $("extraBox").style.display = "block";
            $("extraBox").open = true;
            showThinking("extra");
          }
          break;

        case "sources":
          logDebug("Ask stream sources", { count: (data || []).length });
          if (!isChatMode) {
            renderSources(data);
          }
          break;

        case "token":
          if (data.target === "notes") {
            rawNotes += data.content;
            if (isChatMode) {
              updateStreamingBubble(rawNotes);
            } else {
              scheduleRender("notes", rawNotes);
            }
          } else if (data.target === "extra") {
            if (!isChatMode) {
              if ($("extra").querySelector(".thinking")) {
                $("extra").innerHTML = "";
              }
              rawExtra += data.content;
              scheduleRender("extra", rawExtra);
            }
          }
          break;

        case "notes_done":
          logDebug("Ask stream notes_done", { coverage: data.coverage, answerLen: (data.answer || "").length });
          if (data.answer) {
            rawNotes = data.answer;
            if (isChatMode) {
              updateStreamingBubble(rawNotes);
            } else {
              $("notes").innerHTML = renderMarkdown(rawNotes);
            }
          }
          if (!isChatMode) {
            $("notes").classList.remove("streaming-cursor");
            if (data.coverage) {
              $("cov").textContent = "coverage: " + data.coverage;
              $("cov").style.display = "inline-block";
            }
          }
          break;

        case "extra_done":
          logDebug("Ask stream extra_done", { answerLen: (data.answer || "").length });
          if (data.answer) {
            rawExtra = data.answer;
            if (!isChatMode) {
              $("extra").innerHTML = renderMarkdown(rawExtra);
            }
          }
          if (!isChatMode) {
            $("extra").classList.remove("streaming-cursor");
          }
          break;

        case "error":
          logDebug("Ask stream error", data);
          throw new Error((data && data.message ? data.message : "Stream error") + (data && data.request_id ? " [request_id=" + data.request_id + "]" : ""));

        case "done":
          logDebug("Ask stream done", data);
          break;
      }
    }

    function boot() {
      setStatus("UI ready");
      resetGeneratedAnswerUI();
      loadChatModels();
      loadCourses();
      $("askBtn").addEventListener("click", ask);
      $("q").addEventListener("keydown", function (e) {
        if ((e.ctrlKey || e.metaKey) && e.key === "Enter") ask();
      });

      $("chatModel").addEventListener("change", function () {
        syncChatModelTitle();
        setUserPref("chat_model", getSelectedChatModel());
        logDebug("Chat model changed", { chatModel: getSelectedChatModel() || "(default)" });
      });

      $("courseSelect").addEventListener("change", function () {
        setUserPref("course", getSelectedCourse());
        logDebug("Course changed", { course: getSelectedCourse() || "all" });
      });

      switchMode(true); // always chat mode
      renderSidebar();
      $("newConvBtn").addEventListener("click", startNewConversation);

      $("importBtn").addEventListener("click", function () {
        $("importFileInput").click();
      });
      $("importFileInput").addEventListener("change", function (e) {
        var file = e.target.files && e.target.files[0];
        if (file) {
          importConversation(file);
          e.target.value = ""; // reset so same file can be re-imported
        }
      });

      // Close open menus when clicking anywhere else
      document.addEventListener("click", function (e) {
        if (!e.target.closest(".conv-menu-dropdown") && !e.target.closest(".conv-menu-btn")) {
          closeAllConvMenus();
        }
      });

      function syncLeftSidebarVar() {
        var isCollapsed = $("sidebar").classList.contains("collapsed");
        $("sidebar").parentElement.style.setProperty("--ls-width", isCollapsed ? "0px" : "260px");
      }

      function syncLeftTogglePosition() {
        var sidebar = $("sidebar");
        var toggle = $("sidebarToggle");
        if (sidebar.classList.contains("collapsed")) {
          toggle.style.left = "12px";
          return;
        }
        var rect = sidebar.getBoundingClientRect();
        toggle.style.left = (rect.right + 8) + "px";
      }

      $("sidebarToggle").addEventListener("click", function () {
        $("sidebar").classList.toggle("collapsed");
        $("sidebarToggle").textContent = $("sidebar").classList.contains("collapsed") ? "▶" : "◀";
        syncLeftSidebarVar();
        animateSync(syncLeftTogglePosition);
        animateSync(syncRightTogglePosition);
      });
      syncLeftSidebarVar();
      syncLeftTogglePosition();

      // Problem generation
      $("problemBtn").addEventListener("click", function () { generateProblem(); });

      // New problem button (single mode)
      $("newProblemBtn").addEventListener("click", function () { generateProblem(); });

      // Reveal generated answer (single mode)
      $("showAnswerBtn").addEventListener("click", toggleGeneratedAnswer);

      // Submit answer for assessment (single mode)
      $("submitAnswerBtn").addEventListener("click", submitAnswer);

      // Hint buttons
      $("hintBtn").addEventListener("click", function () { requestHint(); });
      $("rightHintBtn").addEventListener("click", function () { requestHint(true); });

      // Right sidebar event listeners
      $("rightSidebarToggle").addEventListener("click", function () {
        $("rightSidebar").classList.toggle("collapsed");
        $("rightSidebarToggle").textContent = $("rightSidebar").classList.contains("collapsed") ? "◀" : "▶";
        // Clear stale inline width when expanding so default width applies;
        // also sync toggle position
        if (!$("rightSidebar").classList.contains("collapsed")) {
          $("rightSidebar").style.width = "";
        }
        animateSync(syncRightTogglePosition);
      });

      // Custom left-edge resize (native resize handle is always right side)
      (function setupResizeGrip() {
        var grip = $("rightSidebarGrip");
        var sidebar = $("rightSidebar");
        var isDragging = false;
        var startX = 0;
        var startWidth = 0;

        grip.addEventListener("mousedown", function (e) {
          if (sidebar.classList.contains("collapsed")) return;
          isDragging = true;
          startX = e.clientX;
          startWidth = sidebar.getBoundingClientRect().width;
          document.body.style.cursor = "col-resize";
          document.body.style.userSelect = "none";
          e.preventDefault();
        });

        window.addEventListener("mousemove", function (e) {
          if (!isDragging) return;
          var delta = startX - e.clientX; // dragging left = wider
          var newWidth = startWidth + delta;
          newWidth = Math.max(200, newWidth);
          sidebar.style.width = newWidth + "px";
          syncRightTogglePosition();
        });

        window.addEventListener("mouseup", function () {
          if (isDragging) {
            isDragging = false;
            document.body.style.cursor = "";
            document.body.style.userSelect = "";
          }
        });
      })();

      $("rightShowAnswerBtn").addEventListener("click", toggleRightGeneratedAnswer);

      // Click on problem cards in chat to open them in right sidebar
      document.addEventListener("click", function (e) {
        var btn = e.target.closest(".problem-card-btn");
        if (!btn) return;
        var idx = parseInt(btn.getAttribute("data-problem-index"), 10);
        if (isNaN(idx)) return;
        activeProblemIndex = idx;
        renderActiveProblem();
        openRightSidebar();
      });

      // Easier / harder from problem bubbles
      document.addEventListener("click", function (e) {
        var btn = e.target.closest(".problem-adjust-btn");
        if (!btn) return;
        var adj = btn.getAttribute("data-adjust");
        var idx = parseInt(btn.getAttribute("data-problem-index"), 10);
        if (!adj || isNaN(idx)) return;
        e.stopPropagation();
        activeProblemIndex = idx;
        renderActiveProblem();
        generateProblem(adj);
      });

      $("rightSubmitAnswerBtn").addEventListener("click", submitRightAnswer);

      $("rightStudentAnswer").addEventListener("keydown", function (e) {
        if ((e.ctrlKey || e.metaKey) && e.key === "Enter") submitRightAnswer();
      });

      // Enter in answer field submits
      $("studentAnswer").addEventListener("keydown", function (e) {
        if ((e.ctrlKey || e.metaKey) && e.key === "Enter") submitAnswer();
      });

      window.addEventListener("resize", function () {
        syncLeftTogglePosition();
        syncRightTogglePosition();
      });

      window.addEventListener("error", function (e) {
        setError("JS error: " + (e.message || "unknown"));
        setStatus("Error");
      });
      window.addEventListener("unhandledrejection", function (e) {
        setError("Promise error: " + (e.reason || "unknown"));
        setStatus("Error");
      });
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", boot);
    } else {
      boot();
    }
  </script>
</body>

</html>
