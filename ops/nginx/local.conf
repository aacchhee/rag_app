# Nginx config for local docker-compose use.
# Serves ops/www statically and proxies /rag2/* to the `rag` backend
# service over HTTP (unlike the prod template, which uses a unix socket).

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location = /rag2/health {
        proxy_pass http://rag:8000/health;
        proxy_set_header Host $host;
    }

    location = /rag2/chat-models {
        proxy_pass http://rag:8000/chat-models;
        proxy_set_header Host $host;
    }

    location = /rag2/ask {
        proxy_pass http://rag:8000/ask;
        proxy_set_header Host $host;
    }

    location = /rag2/ask-stream {
        proxy_pass http://rag:8000/ask-stream;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    location = /rag2/problem {
        proxy_pass http://rag:8000/problem;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    location = /rag2/calculate-answer {
        proxy_pass http://rag:8000/calculate-answer;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    location = /rag2/assess {
        proxy_pass http://rag:8000/assess;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
