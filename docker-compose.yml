services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    # Localhost only: Docker-published ports bypass the host firewall, and Qdrant
    # has no auth unless an API key is set, so 0.0.0.0 would expose the whole index.
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    # To require a key, uncomment and set QDRANT_API_KEY in .env (the apps send it):
    # environment:
    #   QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes:
      - ./data/qdrant:/qdrant/storage

  rag:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Overrides .env so the app talks to the qdrant service above
      # instead of localhost, regardless of what QDRANT_URL is set to there.
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8000:8000"
    volumes:
      # Source notes for `python -m ingest.ingest` (container path is hardcoded
      # in ingest/ingest.py as /home/rag/notes_repo). Host source is
      # configurable via NOTES_REPO_DIR in .env, defaults to ./notes_repo.
      - ${NOTES_REPO_DIR:-./notes_repo}:/home/rag/notes_repo:ro
      # Optional ingest reference output (VECTOR_DB_PATH), not used at runtime.
      - ./vector_store:/app/vector_store
    depends_on:
      - qdrant

  frontend:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./ops/www:/usr/share/nginx/html:ro
      - ./ops/nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - rag

  ingest:
    build:
      context: .
      dockerfile: Dockerfile.ingest
    profiles: ["ingest"]
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8001:8001"
    volumes:
      - ${NOTES_REPO_DIR:-./notes_repo}:/home/rag/notes_repo:ro
      - ./vector_store:/app/vector_store
      # Persists marker's downloaded model weights (multi-GB) across container
      # recreations instead of re-downloading them from Hugging Face each time.
      - ./data/marker_cache:/root/.cache/huggingface
      # Writable dir for files uploaded via the ingest web UI (PDF, MD, QMD).
      # Kept as its own mount (not nested under the read-only notes_repo mount
      # above, which can't hold new mountpoints) — picked up separately by
      # collect_files().
      - ./data/pdf_uploads:/app/data/pdf_uploads
    depends_on:
      - qdrant
